name: Keep backend awake

# Render's free tier spins the service down after ~15 minutes of idle,
# causing a ~60s cold start for the next visitor. Pinging the health
# endpoint every 10 minutes keeps the demo responsive.
# (One always-on service fits within Render's free 750 instance-hours/month.)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -fsS --retry 3 --max-time 60 https://nexus-d3xg.onrender.com/api/health \
            || echo "Ping failed - backend may be redeploying"
